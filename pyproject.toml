[tool.black]
line-length = 120
target-version = ["py311", "py312", "py313"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
]
ignore = [
    "E501", # line too long (black takes care of formatting)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
